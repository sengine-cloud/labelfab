[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labelfab"
version = "0.2.1"
description = "Queue-driven label rendering and printing for the Phomemo D30"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "sengine" }]
keywords = ["phomemo", "d30", "label", "thermal", "escpos", "mqtt"]
classifiers = [
  "Topic :: Printing",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pillow>=10.3",
  "qrcode>=7.4",
  "python-barcode>=0.15",
  "pydantic>=2.7",
]

[project.optional-dependencies]
agent = ["paho-mqtt>=2.1", "pydantic-settings>=2.3"]
serial = ["pyserial>=3.5"]
ble = ["bleak>=0.22"]
dev = [
  "pytest>=8",
  "pytest-cov",
  "ruff>=0.4",
  "zxing-cpp>=2.2",
  "labelfab[agent]",
]

[project.scripts]
labelfab = "labelfab.cli:main"
labelfab-agent = "labelfab.agent.__main__:main"

[project.urls]
Homepage = "https://github.com/sengine-cloud/labelfab"
Issues = "https://github.com/sengine-cloud/labelfab/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/labelfab"]
# The bundled fonts live inside the package dir, so hatchling ships them as package
# data automatically. A force-include here would add them a second time and the wheel
# build fails with a duplicate-path error.
artifacts = ["src/labelfab/render/_fonts/*.ttf"]

[tool.ruff]
line-length = 105
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "scan: decodes rendered codes with zxing-cpp",
  "docker: requires a working docker daemon",
  "hardware: requires a physical Phomemo D30",
]
