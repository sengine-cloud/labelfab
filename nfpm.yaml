# Packaged with nfpm (https://nfpm.goreleaser.com). VERSION and ARCH come from the
# environment so one file serves both the amd64 and arm64 matrix legs.
#
# What ships is a fully self-contained, relocatable CPython (python-build-standalone)
# at /opt/labelfab/python with the app installed into it. It carries its own stdlib
# and resolves its prefix from the binary location, so it does NOT need any system
# python and works across distros (Ubuntu 24.04 / Python 3.12, Debian, ...). The only
# runtime library it needs is glibc. See deploy/build-deb.sh.
name: labelfab-agent
arch: ${ARCH}
platform: linux
version: ${VERSION}
maintainer: sengine <alex@sengine.cloud>
description: |
  Queue-driven label printing agent for the Phomemo D30.
  Listens on MQTT (or a spool directory), renders QR/barcode/text labels and prints
  a batch as a single continuous strip. No vendor app, no GUI.
vendor: sengine
homepage: https://github.com/sengine-cloud/labelfab
license: MIT
section: utils
priority: optional

depends:
  - libc6
  - bluez
  - dbus
  - libbluetooth3
recommends:
  - libzbar0 # only needed for `labelfab probe --verify-scan`

contents:
  - src: /opt/labelfab
    dst: /opt/labelfab
  - src: deploy/labelfab-agent.service
    dst: /lib/systemd/system/labelfab-agent.service
  - src: deploy/agent.toml.example
    dst: /etc/labelfab/agent.toml
    type: config|noreplace # an upgrade must never clobber a configured host
  - src: /opt/labelfab/python/bin/labelfab
    dst: /usr/bin/labelfab
    type: symlink
  - src: /opt/labelfab/python/bin/labelfab-agent
    dst: /usr/bin/labelfab-agent
    type: symlink

scripts:
  postinstall: deploy/postinst.sh
  preremove: deploy/prerm.sh
